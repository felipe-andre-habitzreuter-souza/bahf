<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Senha</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="conteudo">
    <div class="conteudo-titulo">
      <img src="unlock.svg" alt="Cadeado aberto">
      <h2 class="titulo-principal">Gerador de senhas</h2>
      <h3 class="titulo-secundario">Gere instantaneamente uma senha aleatória e segura</h3>
    </div>

    <div class="conteudo-senha">
      <label for="campo-senha">Senha</label>
      <input type="text" id="campo-senha" readonly placeholder="Sua senha aparecerá aqui">
      <button id="btn-copiar" type="button">Copiar</button>
    </div>

    <div class="parametro">
      <h3 class="parametro-titulo">Personalize sua senha</h3>
      
      <div class="parametro-coluna__senha">
        <div class="parametro-senha">
          <h4 class="parametro-senha__titulo">Número de caracteres</h4>
          <div class="parametro-senha__botoes">
            <button class="parametro-senha__botao">-</button>
            <span class="parametro-senha__texto">12</span>
            <button class="parametro-senha__botao">+</button>
          </div>
        </div>

        <div class="parametro-senha">
          <h4 class="parametro-senha__titulo">Características da senha</h4>
          
          <label class="parametro-checkbox">
            <input type="checkbox" name="maiúsculas" checked>
            Letras maiúsculas
          </label>

          <label class="parametro-checkbox">
            <input type="checkbox" name="minúsculas" checked>
            Letras minúsculas
          </label>

          <label class="parametro-checkbox">
            <input type="checkbox" name="números" checked>
            Números
          </label>

          <label class="parametro-checkbox">
            <input type="checkbox" name="símbolos">
            Símbolos (!@#$)
          </label>
        </div>
      </div>
    </div>

    <button class="btn-gerar" type="button">Gerar Senha</button>
  </main>
</body>
</html>
